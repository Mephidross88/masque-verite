# Relais du suivi en direct autonome (sans Bun) : exécutable Windows construit par tools/2ship-live/build_relay.mjs,
# publié dans une release à l'envoi d'une étiquette « relais-v… » (git tag relais-v1.0.0 && git push origin relais-v1.0.0).
# Lancement manuel : exécutable en artefact, sans release.
name: Relais
on:
  push:
    tags: ['relais-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # action tierce, avec le droit d'écrire les releases : épinglée par son commit (v2.2.0)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.6
      - run: node tools/2ship-live/build_relay.mjs
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Relais du suivi en direct ${GITHUB_REF_NAME#relais-}" --notes-file tools/2ship-live/RELEASE.md
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: relais
          path: dist/
